# VictoriaMetrics Prometheus scrape config
# Auto-scrape Benthos metrics setiap 15 detik

scrape_configs:
  - job_name: "benthos"
    scrape_interval: 15s
    static_configs:
      - targets: ["benthos:4195"]
    metrics_path: /metrics

  - job_name: "victoriametrics-self"
    scrape_interval: 15s
    static_configs:
      - targets: ["victoriametrics:8428"]
    metrics_path: /metrics

  - job_name: "loki-self"
    scrape_interval: 15s
    static_configs:
      - targets: ["victorialogs:9428"]
    metrics_path: /metrics

  - job_name: "ml-engine"
    scrape_interval: 15s
    static_configs:
      - targets: ["ml-engine:8000"]
    metrics_path: /metrics

  - job_name: "misp"
    scrape_interval: 60s
    static_configs:
      - targets: ["misp-exporter:9419"]
    metrics_path: /metrics

  - job_name: "shuffle"
    scrape_interval: 30s
    static_configs:
      - targets: ["shuffle-exporter:9420"]
    metrics_path: /metrics
